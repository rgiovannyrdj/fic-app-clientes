name: fic_clientes
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.17.6 <3.0.0"

dependencies:
  splash_screen_view: ^3.0.0
  dio: ^5.5.0+1
  shared_preferences: ^2.0.15
  flutter_launcher_icons: ^0.11.0
  url_launcher: ^6.1.5
  location: ^5.0.0
  geolocator: ^13.0.1
  qr_flutter: ^4.1.0
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_keyboard_visibility: ^6.0.0
  change_app_package_name: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo_fic.png
    - assets/icon/icon_target.png
    - assets/icon.png
    - assets/icon/

flutter_icons:
  image_path: "assets/icon.png"
  android: true
  ios: true
  adaptive_icon_background: "assets/icon.png"
